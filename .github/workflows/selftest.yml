name: self-test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Descarregar Godot headless
        env:
          GODOT_VERSION: "4.7.2"
        run: |
          set -e
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v*-linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --headless --version

      - name: Regenerar cache de classes
        run: python3 tools/gen_class_cache.py .

      # O self-test joga a sério: gera o mundo, corta, constrói, passa uma noite,
      # fala com um NPC e imprime SELFTEST_PASS ou SELFTEST_FAIL.
      - name: Self-test
        run: |
          godot --headless --path . --quit-after 3000 -- selftest 2>&1 | tee /tmp/selftest.log
          grep -q "SELFTEST_PASS" /tmp/selftest.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest
          path: /tmp/selftest.log
