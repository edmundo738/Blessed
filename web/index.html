<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLESSED — mundo procedural</title>
<style>
	:root { color-scheme: dark; }
	* { box-sizing: border-box; }
	html, body {
		margin: 0; padding: 0; height: 100%;
		background: #07090f; color: #e8ecf6;
		font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
		overflow: hidden;
	}
	#wrap { position: fixed; inset: 0; display: grid; place-items: center; }
	canvas {
		display: block; width: 100%; height: 100%;
		outline: none; background: #0b1220; touch-action: none;
	}
	#status {
		position: fixed; left: 0; right: 0; bottom: 26px;
		text-align: center; font-size: 13px; letter-spacing: .08em;
		text-transform: uppercase; color: #8fa2c4;
		background: linear-gradient(to top, rgba(7,9,15,.9), transparent);
		padding: 14px 0 20px; pointer-events: none;
	}
	#hint {
		position: fixed; top: 14px; left: 0; right: 0; text-align: center;
		font-size: 12px; color: #5d6f92; pointer-events: none; letter-spacing: .04em;
	}
</style>
</head>
<body>
<div id="wrap"><canvas id="canvas" width="1600" height="900" tabindex="0"></canvas></div>
<div id="hint">WASD andar · Shift correr · Espaço saltar · Ctrl agachar · rato olhar · <b>esquerdo</b> trabalhar (segura) · <b>F</b> pegar/interagir · <b>direito</b> (ou X) usar o que tens na mão · B construir · Tab mochila · G largar · Esc pausa</div>
<div id="status">a carregar…</div>

<script type="module">
import Godot from './godot.js';

const status = document.getElementById('status');
const hint = document.getElementById('hint');
const canvas = document.getElementById('canvas');
const setStatus = (t) => { if (status) status.textContent = t; };

try {
	setStatus('a descarregar o mundo…');
	// Sem `no-store`: o .pck tem dezenas de MB e uma recarga da página não pode
	// obrigar a descarregá-lo outra vez. O progresso é mostrado porque a espera
	// é longa — um ecrã parado num build grande lê-se como avaria.
	const resp = await fetch('blessed.pck');
	if (!resp.ok) throw new Error('blessed.pck em falta (' + resp.status + ')');
	const total = Number(resp.headers.get('content-length') || 0);
	let pck;
	if (resp.body && resp.body.getReader) {
		const reader = resp.body.getReader();
		const chunks = [];
		let got = 0;
		for (;;) {
			const { done, value } = await reader.read();
			if (done) break;
			chunks.push(value);
			got += value.length;
			const pct = total ? Math.floor((got / total) * 100) : 0;
			setStatus('a descarregar o mundo… ' + pct + '%  (' +
				(got / 1048576).toFixed(1) + ' MB' + (total ? ' de ' + (total / 1048576).toFixed(1) + ' MB' : '') + ')');
		}
		const all = new Uint8Array(got);
		let at = 0;
		for (const c of chunks) { all.set(c, at); at += c.length; }
		pck = all;
	} else {
		pck = new Uint8Array(await resp.arrayBuffer());
	}

	setStatus('a arrancar o motor…');
	const Module = await Godot({
		canvas,
		locateFile: (p) => (p.endsWith('.wasm') ? 'godot.wasm' : p),
		print: (t) => console.log('[godot]', t),
		printErr: (t) => console.warn('[godot]', t),
	});

	Module.initConfig({
		canvas,
		canvasResizePolicy: 2,
		executable: 'blessed',
		focusCanvas: true,
	});
	await Module.initFS([]);
	Module.copyToFS('/home/web_user/blessed.pck', pck);

	setStatus('a gerar terreno, biomas e floresta…');
	Module.callMain(['--main-pack', '/home/web_user/blessed.pck']);

	if (status) status.remove();
	setTimeout(() => { if (hint) hint.style.opacity = '0.35'; }, 12000);
	canvas.focus();
} catch (e) {
	setStatus('ERRO: ' + ((e && e.message) || e));
	console.error(e);
}
</script>
</body>
</html>
