<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLESSED — mundo procedural</title>
<style>
	:root { color-scheme: dark; }
	* { box-sizing: border-box; }
	html, body {
		margin: 0; padding: 0; height: 100%;
		background: #07090f; color: #e8ecf6;
		font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
		overflow: hidden;
	}
	#wrap { position: fixed; inset: 0; display: grid; place-items: center; }
	canvas {
		display: block; width: 100%; height: 100%;
		outline: none; background: #0b1220; touch-action: none;
	}
	#status {
		position: fixed; left: 0; right: 0; bottom: 26px;
		text-align: center; font-size: 13px; letter-spacing: .08em;
		text-transform: uppercase; color: #8fa2c4;
		background: linear-gradient(to top, rgba(7,9,15,.9), transparent);
		padding: 14px 0 20px; pointer-events: none;
	}
	#hint {
		position: fixed; top: 14px; left: 0; right: 0; text-align: center;
		font-size: 12px; color: #5d6f92; pointer-events: none; letter-spacing: .04em;
	}
</style>
</head>
<body>
<div id="wrap"><canvas id="canvas" width="1600" height="900" tabindex="0"></canvas></div>
<div id="hint">WASD andar · Shift correr · Espaço saltar · Ctrl agachar · rato olhar · botão esquerdo usar · F interagir · B construir · Tab mochila · Esc pausa</div>
<div id="status">a carregar…</div>

<script type="module">
import Godot from './godot.js';

const status = document.getElementById('status');
const hint = document.getElementById('hint');
const canvas = document.getElementById('canvas');
const setStatus = (t) => { if (status) status.textContent = t; };

try {
	setStatus('a descarregar o mundo…');
	const resp = await fetch('blessed.pck', { cache: 'no-store' });
	if (!resp.ok) throw new Error('blessed.pck em falta (' + resp.status + ')');
	const pck = new Uint8Array(await resp.arrayBuffer());

	setStatus('a arrancar o motor…');
	const Module = await Godot({
		canvas,
		locateFile: (p) => (p.endsWith('.wasm') ? 'godot.wasm' : p),
		print: (t) => console.log('[godot]', t),
		printErr: (t) => console.warn('[godot]', t),
	});

	Module.initConfig({
		canvas,
		canvasResizePolicy: 2,
		executable: 'blessed',
		focusCanvas: true,
	});
	await Module.initFS([]);
	Module.copyToFS('/home/web_user/blessed.pck', pck);

	setStatus('a gerar terreno, biomas e floresta…');
	Module.callMain(['--main-pack', '/home/web_user/blessed.pck']);

	if (status) status.remove();
	setTimeout(() => { if (hint) hint.style.opacity = '0.35'; }, 12000);
	canvas.focus();
} catch (e) {
	setStatus('ERRO: ' + ((e && e.message) || e));
	console.error(e);
}
</script>
</body>
</html>
